    source: https://github.com/trinhdhk/joinme/blob/master/
    issue: https://github.com/trinhdhk/joinme/issues/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: true
  toc: true
  math-rendering: katex
  
ignore:
- vignettes/*_files
- vignettes/*_cache
- vignettes/_quarto_out
- vignettes/.quarto
