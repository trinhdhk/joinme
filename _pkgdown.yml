url: https://trinhdhk.github.io/joinme/
repo:
  url:
    home: https://github.com/trinhdhk/joinme/
    source: https://github.com/trinhdhk/joinme/blob/master/
    issue: https://github.com/trinhdhk/joinme/issues/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: true
  toc: true
  math-rendering: katex
  
ignore:
- vignettes/*_files
- vignettes/*_cache
- vignettes/_quarto_out
- vignettes/.quarto
home:
  title: joinme
  description: Bayesian Joint Nested Mixed-Effects (JoiNMe) models for multivariate longitudinal
    and survival data.
articles:
- title: Get started
  contents:
  - joinme-intro
  - joinme-demo
- title: Modelling
  contents:
  - joinme-workflow
  - joinme-discrimination
  - joinme-associations
  - joinme-covariance-regression
  - joinme-model
  - joinme-theory
- title: Latent progress
  contents:
  - joinme-latent-progress-theory
  - joinme-latent-progress-guide
  - joinme-latent-progress-example
  - joinme-mix-simulation-theory
  - joinme-mix-simulation-guide
  - joinme-mix-simulation-example
